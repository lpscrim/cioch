<!DOCTYPE html>
<html>
<head>
    <title>Perfect Fit Order Form</title>
</head>
<body>
    <!-- This form is for Netlify to detect during build -->
    <form name="perfectfit" netlify hidden>
        <input type="hidden" name="form-name" value="perfectfit" />
        <input type="text" name="bot-field" />
        <input type="text" name="first-name" />
        <input type="text" name="last-name" />
        <input type="text" name="company" />
        <input type="email" name="email" />
        <input type="text" name="country" />
        <input type="text" name="phone-number" />
        <textarea name="message"></textarea>
        <!-- Add any other fields your React form uses -->
    </form>
</body>
</html>
