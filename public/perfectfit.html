<!DOCTYPE html>
<html>
<head>
    <title>Perfect Fit Order Form</title>
</head>
<body>
    <!-- This form is for Netlify to detect during build -->
    <form name="perfectfit" netlify hidden>
        <input type="hidden" name="form-name" value="perfectfit" />
        <input type="text" name="bot-field" />

        <!-- Measurements (add all measurement fields you use) -->
        <input type="text" name="height" />
        <input type="text" name="chest" />
        <input type="text" name="waist" />
        <input type="text" name="hips" />
        <input type="text" name="inside-leg" />
        <input type="text" name="arm" />
        <input type="text" name="back" />
        <input type="text" name="other-measurement" />

        <!-- Your Order -->
        <input type="text" name="product" />
        <input type="text" name="size" />
        <input type="text" name="colour" />
        <input type="text" name="quantity" />

        <!-- Your Details -->
        <input type="text" name="realname" />
        <input type="text" name="company" />
        <input type="email" name="email" />
        <input type="text" name="country" />
        <input type="text" name="Address1" />
        <input type="text" name="Address2" />
        <input type="text" name="Town" />
        <input type="text" name="County" />
        <input type="text" name="Postcode" />
        <input type="text" name="phone-number" />
        <textarea name="message"></textarea>
    </form>
</body>
</html>
