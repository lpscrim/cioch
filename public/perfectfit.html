<!DOCTYPE html>
<html>
<head>
    <title>Perfect Fit Order Form</title>
</head>
<body>
    <!-- This form is for Netlify to detect during build -->
    <form name="perfectfit" netlify hidden>
        <input type="hidden" name="form-name" value="perfectfit" />
        <input type="text" name="form-type" value="Perfect Fit" />
        <input type="text" name="bot-field" />

        <!-- Measurement fields (exact names from React form) -->
        <input type="text" name="A - Height" />
        <input type="text" name="B - Arm Length" />
        <input type="text" name="C - Inside Leg" />
        <input type="text" name="D - Body Rise" />
        <input type="text" name="E - Back Length of Jacket" />
        <input type="text" name="F - Nape to waist" />
        <input type="text" name="G - Chest / Bust" />
        <input type="text" name="H - Waist" />
        <input type="text" name="I - Seat / Hips" />
        <input type="text" name="J - Collar" />

        <!-- Order fields -->
        <input type="text" name="Product1" />
        <input type="text" name="Quantity1" />
        <input type="text" name="Product2" />
        <input type="text" name="Quantity2" />
        <input type="text" name="Product3" />
        <input type="text" name="Quantity3" />
        <input type="text" name="Product4" />
        <input type="text" name="Quantity4" />
        <input type="text" name="Product5" />
        <input type="text" name="Quantity5" />

        <!-- Details fields -->
        <input type="text" name="Title" />
        <input type="text" name="realname" />
        <input type="text" name="Address1" />
        <input type="text" name="Address2" />
        <input type="text" name="Town/City" />
        <input type="text" name="Area/State" />
        <input type="text" name="Postcode" />
        <input type="text" name="Country" />
        <input type="email" name="email" />
        <input type="text" name="Telephone" />
    </form>
</body>
</html>
