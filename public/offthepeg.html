<!DOCTYPE html>
<html>
<head>
    <title>Off The Peg Order Form</title>
</head>
<body>
    <!-- This form is for Netlify to detect during build -->
    <form name="offthepeg" netlify hidden>
        <input type="hidden" name="form-name" value="offthepeg" />
        <input type="text" name="bot-field" />

        <!-- Your Order (repeat for up to 5 items as in your React form) -->
        <input type="text" name="order-1-product" />
        <input type="text" name="order-1-size" />
        <input type="text" name="order-1-colour" />
        <input type="text" name="order-1-quantity" />
        <input type="text" name="order-2-product" />
        <input type="text" name="order-2-size" />
        <input type="text" name="order-2-colour" />
        <input type="text" name="order-2-quantity" />
        <input type="text" name="order-3-product" />
        <input type="text" name="order-3-size" />
        <input type="text" name="order-3-colour" />
        <input type="text" name="order-3-quantity" />
        <input type="text" name="order-4-product" />
        <input type="text" name="order-4-size" />
        <input type="text" name="order-4-colour" />
        <input type="text" name="order-4-quantity" />
        <input type="text" name="order-5-product" />
        <input type="text" name="order-5-size" />
        <input type="text" name="order-5-colour" />
        <input type="text" name="order-5-quantity" />

        <!-- Your Details -->
        <input type="text" name="realname" />
        <input type="text" name="company" />
        <input type="email" name="email" />
        <input type="text" name="country" />
        <input type="text" name="Address1" />
        <input type="text" name="Address2" />
        <input type="text" name="Town" />
        <input type="text" name="County" />
        <input type="text" name="Postcode" />
        <input type="text" name="phone-number" />
        <textarea name="message"></textarea>
    </form>
</body>
</html>
